name: Footer Heading Contrast Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/footer-heading-contrast.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update footer heading contrast
        run: python scripts/footer_heading_contrast.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git commit -m "Improve footer heading contrast"
          git push
