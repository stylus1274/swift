name: Footer Navigation Update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/footer-links-fix.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update footer navigation sitewide
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('app').rglob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(
                  '<a href="#home">Home</a><a href="#services">Services</a><a href="#portfolio">Portfolio</a><a href="#about">About</a><a href="#contact">Contact</a>',
                  '<a href="/">Home</a><a href="/services">Services</a><a href="/gallery">Portfolio</a><a href="/about">About</a><a href="/blog">Blog</a><a href="/contact">Contact</a>'
              )
              updated = updated.replace('<a href="/#services">Services</a>', '<a href="/services">Services</a>')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:')
          for path in changed:
              print(f'- {path}')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No footer changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Point footer navigation to dedicated pages"
          git push
