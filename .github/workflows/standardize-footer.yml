name: Standardize Site Footer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standardize-footer.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Standardize footers
        run: python scripts/standardize_footer.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "Use shared footer across site"
          git push
