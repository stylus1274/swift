name: Remove Footer Email

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-footer-email.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove footer email
        run: python scripts/remove_footer_email.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Remove email from footer contact blocks"
          git push
