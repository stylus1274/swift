name: Live Site QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait briefly for Vercel alias
        run: sleep 30

      - name: Crawl deployed site
        env:
          QA_BASE_URL: https://swift-nine-wheat.vercel.app
        run: node scripts/qa-site.mjs
