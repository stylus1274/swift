name: One-Time Contact Form Test

on:
  push:
    paths:
      - ".github/workflows/contact-form-test.yml"

jobs:
  test-contact-form:
    runs-on: ubuntu-latest
    steps:
      - name: Submit production contact form test
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5             -X POST "https://swiftconstructionandpainting.com/api/contact"             -H "Origin: https://swiftconstructionandpainting.com"             -H "Content-Type: application/json"             --data '{"formName":"ChatGPT Resend Test","page":"https://swiftconstructionandpainting.com/contact","fields":[{"label":"Name","value":"ChatGPT Resend Test"},{"label":"Phone","value":"813-555-0100"},{"label":"Email","value":"charlieb@velvetinkmedia.com"},{"label":"Project ZIP","value":"34609"},{"label":"Project Type","value":"Other project"},{"label":"Ideal Timing","value":"Just researching"},{"label":"Project Details","value":"Automated test submission to verify the Swift website contact form and Resend delivery."}]}')"
          echo "$response"
