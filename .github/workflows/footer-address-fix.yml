name: Footer Address Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/footer-address-fix.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace footer links with address
        run: python scripts/footer_address_fix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Replace footer CTA links with business address"
          git push
