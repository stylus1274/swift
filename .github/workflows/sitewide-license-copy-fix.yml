name: Sitewide License Copy Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sitewide-license-copy-fix.yml"

permissions:
  contents: write

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace General Contractor references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app'), Path('components')]
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.md', '.json'}

          def replace_phrase(match):
              original = match.group(0)
              plural = original.lower().endswith('contractors')
              replacement = 'building contractors' if plural else 'building contractor'
              if original.isupper():
                  return replacement.upper()
              if original[0].isupper():
                  return replacement.capitalize()
              return replacement

          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in extensions:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace('GeneralContractor', 'HomeAndConstructionBusiness')
                  updated = re.sub(r'\bgeneral contractors?\b', replace_phrase, updated, flags=re.IGNORECASE)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))

          print('Updated files:')
          for path in changed:
              print(f'- {path}')
          PY

      - name: Commit sitewide correction
        run: |
          if git diff --quiet; then
            echo "No matching copy found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "Correct contractor license terminology sitewide"
          git push
