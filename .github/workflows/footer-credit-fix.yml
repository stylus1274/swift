name: Footer Spacing and Credit Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/footer-credit-fix.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run footer update script
        run: python scripts/footer_credit_fix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Improve footer spacing and add Velvet Ink credit"
          git push
